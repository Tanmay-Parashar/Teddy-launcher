name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: monolith-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk TeddysLauncher.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TeddysLauncher.apk --title "Teddy's Launcher (latest)" --notes "Release build from commit ${GITHUB_SHA::7}"
